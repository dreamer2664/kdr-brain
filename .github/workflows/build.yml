# Rebuilds the whole brain from source on every push and publishes the artifacts
# as a rolling GitHub Release called "latest". Free on public repos (unlimited minutes).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy

      - name: Cache the two fp32 checkpoints (224 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: /tmp/build
          key: hf-checkpoints-v1

      - name: Download checkpoints from Hugging Face (public, no login)
        run: |
          mkdir -p /tmp/build/reader
          [ -s /tmp/build/model.safetensors ] || curl -fL --retry 3 -o /tmp/build/model.safetensors \
            https://huggingface.co/sentence-transformers/multi-qa-MiniLM-L6-cos-v1/resolve/main/model.safetensors
          [ -s /tmp/build/reader/model.safetensors ] || curl -fL --retry 3 -o /tmp/build/reader/model.safetensors \
            https://huggingface.co/deepset/minilm-uncased-squad2/resolve/main/model.safetensors
          ls -la /tmp/build /tmp/build/reader

      - name: Cache llama.cpp static libs (built once per tag)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kdr/llama
          key: llama-cpp-v0.4.0-portable-v1

      - name: Build llama.cpp (portable x86-64-v3)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: PORTABLE=1 sh scripts/build_llama.sh

      - name: Compile the inference engine (static binary, retrieval + reader + composer)
        run: make

      - name: Quantize + embed + pack -> release/brain.kdr
        run: python3 scripts/pack.py

      - name: Download the composer model (Qwen2.5-0.5B-Instruct Q4_K_M, Apache-2.0)
        run: |
          mkdir -p release
          curl -fL --retry 3 -o release/composer.gguf \
            https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
          ls -la release

      - name: Fetch the general-knowledge pack from the "wiki" release (built by the wiki-pack workflow; optional)
        run: |
          curl -fL --retry 3 -o release/wiki.kdw https://github.com/${{ github.repository }}/releases/download/wiki/wiki.kdw || rm -f release/wiki.kdw
          ls -la release

      - name: Size gate (brain + engine < 80 MB, wiki pack < 120 MB, everything < 600 MB)
        run: |
          core=$(( $(stat -c %s release/brain.kdr) + $(stat -c %s release/kdr-brain) ))
          wiki=$(stat -c %s release/wiki.kdw 2>/dev/null || echo 0)
          total=$(( core + wiki + $(stat -c %s release/composer.gguf) ))
          echo "brain.kdr + kdr-brain = $core bytes; wiki.kdw = $wiki bytes; with composer = $total bytes"
          test "$core" -lt 80000000 && test "$wiki" -lt 120000000 && test "$total" -lt 600000000

      - name: Quality gate 1 - extractive reader (75 questions, >= 72 exact)
        run: python3 scripts/eval_c.py --strict

      - name: Quality gate 2 - chat scores (kingdom + chat blocks >= 9/10, general-knowledge blocks >= 7/10 when wiki.kdw is present)
        run: KDR_THREADS=4 python3 scripts/score.py --strict

      - name: Also build the chat-less 1.5 MB engine (works with brain.kdr alone)
        run: make lite && ls -la release

      - name: Publish rolling release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 3
          gh release create latest release/brain.kdr release/kdr-brain release/kdr-brain-lite release/composer.gguf $( [ -s release/wiki.kdw ] && echo release/wiki.kdw ) \
            --title "kdr-brain build #${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }} on $(date -u +%Y-%m-%d). Assets: brain.kdr (retriever+reader+kingdom knowledge, 58 MB), kdr-brain (static Linux x86-64 binary with chat, 8 MB), kdr-brain-lite (extractive-only binary, 1.5 MB), composer.gguf (Qwen2.5-0.5B-Instruct Q4_K_M, 398 MB), wiki.kdw (general-knowledge pack from Wikipedia, when the wiki-pack workflow has run). Restore with: KDR_REPO=owner/kdr-brain sh scripts/restore.sh"
